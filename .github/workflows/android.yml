name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Release 에 APK 를 붙이기 위해 필요
    steps:
      - uses: actions/checkout@v4

      # Gradle 이 6분 뒤에 알려줄 리소스 오류를 여기서 몇 초 만에 잡는다
      - name: Validate Android XML resources
        run: python3 tools/check-xml.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync to Android
        run: npm run sync

      # 웹 UI로 업로드하면 실행 권한이 사라지므로 여기서 다시 준다
      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: omok-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: omok-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 폰에서 바로 눌러 설치할 수 있도록 Release 에 APK 를 그대로 붙인다.
      # (Artifacts 는 zip 으로 내려와서 폰에서 한 번 더 풀어야 한다)
      # 권한이 막혀 있어도 빌드 자체는 성공시킨다 — Artifacts 로 받으면 되므로.
      - name: Attach APK to a release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="omok-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "build-${{ github.run_number }}" "$APK" \
            --title "오목 빌드 #${{ github.run_number }}" \
            --notes "폰에서 아래 $APK 를 눌러 설치하세요. (디버그 서명 빌드)" \
            --latest
