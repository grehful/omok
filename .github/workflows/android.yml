name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: omok
            label: 오목
            dir: .
            sync: npm run sync
            slug: omok
          - app: duck
            label: 덕 헌팅
            dir: duck
            sync: npm run sync:duck
            slug: duckhunt
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      # Gradle 이 6분 뒤에 알려줄 리소스 오류를 여기서 몇 초 만에 잡는다
      - name: Validate Android XML resources
        run: python3 tools/check-xml.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync to Android
        run: ${{ matrix.sync }}

      # 웹 UI로 업로드하면 실행 권한이 사라지므로 여기서 다시 준다
      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: ${{ matrix.dir }}/android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ${{ matrix.dir }}/android

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: ${{ matrix.dir }}/android

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-debug-apk
          path: ${{ matrix.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-release-unsigned-apk
          path: ${{ matrix.dir }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # 폰에서 바로 눌러 설치할 수 있도록 Release 에 APK 를 그대로 붙인다.
  # (Artifacts 는 zip 으로 내려와서 폰에서 한 번 더 풀어야 한다)
  # 권한이 막혀 있어도 빌드 자체는 성공시킨다 — Artifacts 로 받으면 되므로.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write        # Release 에 APK 를 붙이기 위해 필요
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-debug-apk"
          path: apks

      - name: Attach APKs to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          N="${{ github.run_number }}"
          cp apks/omok-debug-apk/app-debug.apk "omok-$N.apk"
          cp apks/duckhunt-debug-apk/app-debug.apk "duckhunt-$N.apk"
          gh release create "build-$N" "omok-$N.apk" "duckhunt-$N.apk" \
            --title "빌드 #$N" \
            --notes "폰에서 아래 APK 를 눌러 설치하세요. (디버그 서명 빌드)

          - \`omok-$N.apk\` — 오목
          - \`duckhunt-$N.apk\` — 덕 헌팅" \
            --latest
